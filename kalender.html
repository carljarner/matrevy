<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f2328" />
  <title>Kalender · Matematikrevyen</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/calendar.css" />
</head>
<body>
  <!-- Nav + login rendered by site.js from its central page registry -->
  <header class="site-header">
    <div class="site-title">Matematikrevyen</div>
  </header>

  <main class="page-content">
    <h1>Kalender</h1>

    <section class="card">
      <div class="cal-toolbar">
        <div class="cal-view-toggle">
          <button id="cal-view-month" type="button">Måned</button>
          <button id="cal-view-list" type="button">Liste</button>
        </div>
        <div class="cal-month-nav" id="cal-month-nav">
          <button id="cal-prev" type="button" aria-label="Forrige måned">‹</button>
          <span id="cal-month-label"></span>
          <button id="cal-next" type="button" aria-label="Næste måned">›</button>
        </div>
        <span id="cal-admin"></span>
      </div>
      <div id="cal-view"></div>
    </section>
  </main>

  <footer class="site-footer">
    Matematikrevyen · Intern side
  </footer>

  <script src="js/site.js"></script>
  <script src="js/site-utils.js"></script>
  <script src="js/calendar-data.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
