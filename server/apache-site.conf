# Virtual host for the site image (server/Dockerfile.site). Traefik in front
# terminates TLS, so every external URL is https.
<VirtualHost *:80>
    DocumentRoot /var/www/html

    # One canonical host: www.matematikrevy.dk -> matematikrevy.dk. Pages on
    # www would otherwise call the API from an origin its CORS header
    # doesn't allow, and keep a separate login (localStorage is per-origin).
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
    RewriteRule ^ https://%1%{REQUEST_URI} [R=301,L]

    # Clean page URLs: /kalender serves kalender.html. Only a single
    # root-level segment that names an existing page file, so the aliased
    # data folders below are never touched. server/dev-router.php does the
    # same for `php -S`; keep the two in sync.
    # Old .html links (bookmarks, printed QR codes) 301 to the clean URL.
    # THE_REQUEST is what the browser sent, so the internal rewrite at the
    # bottom can't loop back into this rule.
    RewriteCond %{THE_REQUEST} ^[A-Z]+\ /index(\.html)?[?\s]
    RewriteRule ^/index(\.html)?$ / [R=301,L]
    RewriteCond %{THE_REQUEST} ^[A-Z]+\ /[a-z-]+\.html[?\s]
    RewriteCond %{DOCUMENT_ROOT}/$1.html -f
    RewriteRule ^/([a-z-]+)\.html$ /$1 [R=301,L]
    # A trailing slash would break the pages' relative asset paths.
    RewriteCond %{DOCUMENT_ROOT}/$1.html -f
    RewriteRule ^/([a-z-]+)/$ /$1 [R=301,L]
    RewriteCond %{DOCUMENT_ROOT}/$1.html -f
    RewriteRule ^/([a-z-]+)$ /$1.html [PT,L]

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Writable site files live on the persistent disk (SITE_DATA_DIR).
    Alias /data/    /data/site/data/
    Alias /archive/ /data/site/archive/
    Alias /posts/   /data/site/posts/
    Alias /wiki/    /data/site/wiki/
    # Every js/<name>-data.js is generated by the worker, except
    # js/manus-data.js, which is hand-written code shipped in the image.
    AliasMatch "^/js/((?!manus-data\.js)[a-z]+-data\.js)$" "/data/site/generated/js/$1"
    Alias /calendar.ics /data/site/generated/calendar.ics

    <Directory /data/site>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Browsers revalidate on every load (a cheap 304 when unchanged), so a
    # save or a code deploy is never hidden behind a stale cache.
    Header set Cache-Control "no-cache"
    <Files "calendar.ics">
        ForceType "text/calendar; charset=utf-8"
    </Files>
</VirtualHost>
