<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f2328" />
  <title>Matematikrevyen</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
</head>
<body>
  <!-- Nav + login rendered by site.js from its central page registry -->
  <header class="site-header">
    <div class="site-title">Matematikrevyen</div>
  </header>

  <main class="page-content">
    <h1>Opslagstavle</h1>

    <!-- Post board, rendered by posts.js from posts-data.js.
         Left: a single Facebook-style feed of every post, pinned ones
         sorted first and visually separated from the rest by a labeled
         "Opslag" break. Only posts from the last 6 months show by default
         (pinned posts are exempt); "Indlæs en måned mere" in #posts-load-more
         widens that window by one month at a time (revyst+ can create,
         boss/admin edit/delete/pin from each card).
         Right: the Bosser card, rendered by bosses.js from bosses-data.js
         (admin-only "Rediger" button next to the title toggles an inline
         edit mode — transparent in-place text fields, draggable rows,
         add/remove, "Rediger"→"Annuller" with a "Gem" button at the
         bottom). -->
    <div class="dashboard-columns">
      <section class="card dashboard-board">
        <div class="card-head">
          <h2>Fastgjorte Opslag</h2>
          <span id="posts-admin"></span>
        </div>
        <div class="message-list" id="posts-list"></div>
        <div id="posts-load-more"></div>
      </section>

      <section class="card dashboard-board-bosses">
        <div class="card-head">
          <h2 id="bosses-title"></h2>
          <span id="bosses-admin"></span>
        </div>
        <ul class="boss-list" id="bosses-list"></ul>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div>Denne side er en samling og videreførelse af arbejde fra en masse revyster gennem tiden, stort tak til alle dem!</div>
    <div>Irriterende elementer og forslag til forbedringer sendes til Carl Jarner. Hvis de er værd at implementere, så gir jeg en øl.</div>
  </footer>

  <script src="js/site.js"></script>
  <script src="js/site-utils.js"></script>
  <script src="js/posts-data.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/bosses-data.js"></script>
  <script src="js/bosses.js"></script>
</body>
</html>
