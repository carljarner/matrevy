<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f2328" />
  <title>Manus · Matematikrevyen</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="stylesheet" href="css/manus.css" />
</head>
<body>
  <!-- Nav + login rendered by site.js from its central page registry -->
  <header class="site-header">
    <div class="site-title">Matematikrevyen</div>
  </header>

  <main class="page-content">
    <h1>Manus</h1>

    <div class="manus-layout">
      <!-- Upload pool (Sketches / Songs), rendered by manus.js from
           MANUSCRIPTS_DATA (manuscripts-data.js). Each column becomes a
           closed-by-default toggle once this year's manus (scenes.json)
           has content; otherwise it's a plain always-open list. -->
      <div class="manus-columns" id="manus-columns"></div>

      <!-- Static guide box + Upload (revyst+) / Aktfordeling (boss+)
           button, rendered by manus.js — a single mount point since
           only one is ever shown. The button sits below the guide
           box, not inside it. -->
      <div class="manus-guide-col">
        <aside class="manus-guide card">
          <h2>Manus Guide</h2>
          <div class="manus-guide-text" id="manus-guide-text">
            <p>Læg .sty filen i dit projekt:<br><a class="manus-guide-link" href="manus/revy.sty" download="revy.sty">revy.sty</a></p>
            <p>Brug følgende skabeloner:<br><a class="manus-guide-link" href="manus/skabelon-sang.tex" download="sang.tex">sang.tex</a> <a class="manus-guide-link" href="manus/skabelon-sketch.tex" download="sketch.tex">sketch.tex</a></p>
            <p>Tidligere års sange:<br><a class="manus-guide-link" href="https://docs.google.com/spreadsheets/d/1BSXL_RKFqfp6Vy7VXyH-7191tjBnJVlsWFN7HFIzILE/edit?usp=sharing" target="_blank" rel="noopener">Link</a></p>
            <p>Manusdrevet:<br><a class="manus-guide-link" href="https://drive.google.com/drive/folders/1H9RHvqZThozdlrgUjNzBMwJRQEI29YSW?usp=drive_link" target="_blank" rel="noopener">Drev</a></p>
          </div>
        </aside>
        <div class="manus-bottom-actions" id="manus-bottom-actions"></div>
      </div>
    </div>

    <!-- Read-only "Dette års manus" act list, shown once scenes.json has
         content — rendered by manus.js from getEffectiveScenesData(). -->
    <section class="card" id="manus-year-section" style="display:none">
      <h2>Dette års manus</h2>
      <div id="manus-year-acts"></div>
    </section>

    <!-- "Hent stemmeark" print target — hidden on screen (see manus.css's
         @media print block), filled in just before window.print(). -->
    <div class="manus-print-only" id="manus-print-sheet"></div>
  </main>

  <footer class="site-footer">
    Matematikrevyen · Intern side
  </footer>

  <script src="js/site.js"></script>
  <script src="js/site-utils.js"></script>
  <script src="js/scenes-data.js"></script>
  <script src="js/manus-data.js"></script>
  <script src="js/manuscripts-data.js"></script>
  <script src="js/manus.js"></script>
</body>
</html>
