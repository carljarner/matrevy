<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f2328" />
  <title>Wiki · Matematikrevyen</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="stylesheet" href="css/wiki.css" />
</head>
<body>
  <!-- Nav + login rendered by site.js from its central page registry -->
  <header class="site-header">
    <div class="site-title">Matematikrevyen</div>
  </header>

  <main class="page-content">
    <h1>Wiki</h1>

    <!-- Two-column layout, same 2:1 grid ratio as Forside's dashboard-columns
         but mirrored: the smaller column (chapters) is on the left, the
         larger one (selected chapter's content) on the right. Each chapter
         is a single continuous rich-text record; clicking one re-renders
         the right column with either its read view or, for boss/admin
         while editing, an in-place rich-text edit view (see wiki.js). -->
    <div class="wiki-columns">
      <section class="card wiki-chapters">
        <div class="card-head">
          <h2>Kapitler</h2>
        </div>
        <nav class="wiki-chapter-list" id="wiki-chapter-list"></nav>
        <div class="wiki-chapter-actions" id="wiki-chapter-actions"></div>
      </section>

      <section class="card wiki-content" id="wiki-content-body"></section>
    </div>
  </main>

  <footer class="site-footer">
    <div>Denne side er en samling og videreførelse af arbejde fra en masse revyster gennem tiden, stort tak til alle dem!</div>
    <div>Irriterende elementer og forslag til forbedringer sendes til Carl Jarner. Hvis de er værd at implementere, så gir jeg en øl.</div>
  </footer>

  <script src="js/site.js"></script>
  <script src="js/site-utils.js"></script>
  <script src="js/wiki-data.js"></script>
  <script src="js/wiki.js"></script>
</body>
</html>
