# matrevy on web-1, deployed by Coolify as one Docker
# Compose resource. Coolify lists the ${...} variables for you to fill in;
# give only the `web` service a domain.
services:
  web:
    build:
      context: .
      dockerfile: server/Dockerfile.site
    # Apache's port inside the container, for Coolify/Traefik routing. Not
    # published on the host.
    expose:
      - "80"
    environment:
      REVYST_PASSWORD: ${REVYST_PASSWORD}
      BOSS_PASSWORD: ${BOSS_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SHARED_PIN: ${SHARED_PIN:-}
    volumes:
      - /srv/matrevy/data:/data
    # Traefik only routes to a container once its healthcheck has passed,
    # and Docker runs the first check one `interval` after start — so the
    # interval is also the 503 window on every deploy. 5 s keeps that short
    # (a curl of health.php is cheap); start_period stops slow first checks
    # from counting as failures. (start_interval would allow a longer steady
    # interval, but needs Docker Engine 25+.)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health.php"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: server/Dockerfile.worker
    environment:
      # Mirrors archive/ to the GitHub repo (server/worker.sh). Base64 of a
      # deploy key with write access; leave empty to turn the mirror off.
      ARCHIVE_SYNC_DEPLOY_KEY: ${ARCHIVE_SYNC_DEPLOY_KEY:-}
      ARCHIVE_SYNC_QUIET_SECONDS: ${ARCHIVE_SYNC_QUIET_SECONDS:-300}
    volumes:
      - /srv/matrevy/data:/data
    # worker.sh touches the heartbeat every loop pass (every 2 s when idle);
    # 15 min of silence means the loop is stuck. start_period covers the
    # startup embed before the first pass.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker-heartbeat -mmin -15 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
