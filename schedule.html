<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f2328" />
  <title>Øveplan · Matematikrevyen</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="stylesheet" href="css/schedule.css" />
</head>
<body>
  <!-- Nav + login rendered by site.js from its central page registry -->
  <header class="site-header">
    <div class="site-title">Matematikrevyen</div>
  </header>

  <main class="sched-layout">

    <!-- ── LEFT: Day setup + Scene sidebar ── -->
    <aside class="sched-sidebar">

      <section class="sched-panel">
        <h2>Dagens opsætning</h2>

        <label class="field-label">Starttidspunkt
          <span id="input-start-mount"></span>
        </label>

        <label class="field-label">Sluttidspunkt
          <span id="input-end-mount"></span>
        </label>

        <label class="field-label">Segmentlængde
          <select id="input-segment">
            <option value="15">15 min</option>
            <option value="20">20 min</option>
            <option value="25">25 min</option>
            <option value="30" selected>30 min</option>
            <option value="45">45 min</option>
            <option value="60">60 min</option>
          </select>
        </label>

        <label class="field-label">Pause mellem segmenter
          <select id="input-gap">
            <option value="0" selected>0 min</option>
            <option value="1">1 min</option>
            <option value="2">2 min</option>
            <option value="3">3 min</option>
            <option value="4">4 min</option>
            <option value="5">5 min</option>
            <option value="6">6 min</option>
            <option value="7">7 min</option>
            <option value="8">8 min</option>
            <option value="9">9 min</option>
            <option value="10">10 min</option>
          </select>
        </label>

        <label class="field-label">Lokaler
          <textarea id="input-rooms" rows="5" placeholder="Lille UP1&#10;Store UP1&#10;Lokale&#10;Bandet&#10;Rekvisitten"></textarea>
        </label>

        <button class="btn-primary" id="btn-build">Byg øveplan</button>
      </section>

      <section class="sched-panel constr-panel">
        <h2>Dagens ønsker</h2>

        <div class="field-label">Fraværende revyster</div>
        <div id="absent-list" class="absent-list"></div>

        <button class="btn-secondary" id="btn-add-absent">+ Tilføj fravær</button>

        <div id="absent-form" class="absent-form" style="display:none">
          <label class="field-label">Navn
            <span id="absent-form-name"></span>
          </label>
          <div class="absent-form-times">
            <label class="field-label">Fra
              <span id="absent-form-start-mount"></span>
            </label>
            <label class="field-label">Til
              <span id="absent-form-end-mount"></span>
            </label>
          </div>
          <div class="absent-form-actions">
            <button class="btn-secondary" id="absent-form-cancel">Annuller</button>
            <button class="btn-primary" id="absent-form-confirm">Tilføj</button>
          </div>
        </div>

        <div id="scene-sidebar" style="display:none">
          <div class="scene-sidebar-heading">Scener</div>
          <div id="scene-list"></div>
        </div>
      </section>

    </aside>

    <!-- ── RIGHT: Grid ── -->
    <section class="sched-main">
      <div class="sched-grid-wrapper">
        <div id="sched-empty-state" class="sched-empty">
          <p>Udfyld dagens opsætning til venstre og tryk <strong>Byg øveplan</strong>.</p>
        </div>
        <div id="sched-grid-container" style="display:none">
          <div class="sched-grid-header">
            <div id="sched-grid-title" class="sched-grid-title" contenteditable="true" spellcheck="false" title="Klik for at omdøbe"></div>
            <div class="sched-grid-actions">
              <button class="btn-secondary" id="btn-export">Download</button>
              <button class="btn-secondary" id="btn-clear-schedule">Ryd skema</button>
            </div>
          </div>
          <div class="sched-table-scroll">
            <table id="sched-table" class="sched-table">
              <thead id="sched-thead"></thead>
              <tbody id="sched-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Scene picker modal -->
  <div id="picker-overlay" class="picker-overlay" style="display:none">
    <div class="picker-modal">
      <div class="picker-header">
        <span id="picker-title">Vælg scener</span>
        <button class="picker-close" id="picker-close">✕</button>
      </div>
      <div id="picker-list" class="picker-list"></div>
      <div class="picker-footer">
        <button class="btn-primary" id="picker-confirm" disabled>Placer</button>
      </div>
    </div>
  </div>

  <!-- Ryd skema confirmation: shared site-wide .login-overlay/.login-modal
       chrome (style.css), styled like Budget's own delete-confirm dialogs
       (e.g. openExpenseRemoveConfirm in js/budget.js) — no h2 heading, one
       bold centered title line instead, centered Annuller/danger pills. -->
  <div id="clear-confirm-overlay" class="login-overlay" style="display:none">
    <div class="login-modal sched-confirm-modal">
      <p class="sched-confirm-title">Ryd skema?</p>
      <p class="sched-confirm-body">Dette kan ikke fortrydes.</p>
      <div class="login-actions">
        <button class="site-pill-btn" id="clear-confirm-cancel">Annuller</button>
        <button class="site-pill-btn site-pill-danger" id="clear-confirm-ok">Ryd</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    Matematikrevyen · Intern side
  </footer>

  <script src="js/site.js"></script>
  <script src="js/scenes-data.js"></script>
  <script src="js/schedule.js"></script>
</body>
</html>
