<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Øveplan · Matematikrevyen 2025</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="schedule.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-title">Matematikrevyen 2025</div>
    <nav class="site-nav">
      <a href="index.html">Forside</a>
      <a href="manus.html">Manus</a>
      <a href="schedule.html" class="active">Øveplan</a>
    </nav>
  </header>

  <main class="sched-layout">

    <!-- ── LEFT: Day setup + Scene sidebar ── -->
    <aside class="sched-sidebar">

      <section class="sched-panel">
        <h2>Dagens opsætning</h2>

        <label class="field-label">Dato
          <input type="date" id="input-date" />
        </label>

        <label class="field-label">Starttidspunkt
          <input type="time" id="input-start" value="10:00" step="1800" />
        </label>

        <label class="field-label">Sluttidspunkt
          <input type="time" id="input-end" value="17:00" step="1800" />
        </label>

        <label class="field-label">Lokaler <span class="hint">(ét per linje)</span>
          <textarea id="input-rooms" rows="5" placeholder="Lille UP1&#10;Store UP1&#10;Biblioteket&#10;A101&#10;Bandet">Lille UP1
Store UP1
Biblioteket
Bandet</textarea>
        </label>

        <label class="field-label">Fraværende hele dagen <span class="hint">(ét navn per linje)</span>
          <textarea id="input-absent" rows="4" placeholder="Navn&#10;Navn"></textarea>
        </label>

        <button class="btn-primary" id="btn-build">Byg øveplan</button>
      </section>

      <section class="sched-panel" id="scene-sidebar" style="display:none">
        <h2>Scener <span id="scene-count-label" class="hint"></span></h2>
        <div class="scene-filter-row">
          <input type="search" id="scene-search" placeholder="Søg scene…" />
        </div>
        <div id="scene-list"></div>
      </section>

    </aside>

    <!-- ── RIGHT: Grid ── -->
    <section class="sched-main">
      <div class="sched-grid-wrapper">
        <div id="sched-empty-state" class="sched-empty">
          <p>Udfyld dagens opsætning til venstre og tryk <strong>Byg øveplan</strong>.</p>
        </div>
        <div id="sched-grid-container" style="display:none">
          <div class="sched-grid-header">
            <div id="sched-grid-title" class="sched-grid-title"></div>
            <div class="sched-grid-actions">
              <button class="btn-autoplace" id="btn-autoplace">⚡ Auto-placer prioritet 3</button>
              <button class="btn-secondary" id="btn-clear-auto">Ryd auto-placerede</button>
              <button class="btn-secondary" id="btn-export">Udskriv / Gem PDF</button>
            </div>
            <div id="autoplace-summary" class="autoplace-summary" style="display:none"></div>
          </div>
          <div class="sched-table-scroll">
            <table id="sched-table" class="sched-table">
              <thead id="sched-thead"></thead>
              <tbody id="sched-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Scene picker modal -->
  <div id="picker-overlay" class="picker-overlay" style="display:none">
    <div class="picker-modal">
      <div class="picker-header">
        <span id="picker-title">Vælg scene</span>
        <button class="picker-close" id="picker-close">✕</button>
      </div>
      <input type="search" id="picker-search" placeholder="Søg…" />
      <div id="picker-list" class="picker-list"></div>
    </div>
  </div>

  <footer class="site-footer">
    Matematikrevyen 2025 · Intern side
  </footer>

  <script src="scenes-data.js"></script>
  <script src="schedule.js"></script>
</body>
</html>
