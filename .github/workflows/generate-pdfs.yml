name: Generate manuscript PDFs

# Fires on the exact same trigger as embed-scenes.yml (any push touching
# data/scenes.json or data/cast.json) — a manus.html save already produces
# this push (see save_manus() in server/update-data.php, which always
# re-stamps scenes.json's version, guaranteeing a fresh commit even when a
# Main Manus View "Generér <X>" button re-saves otherwise-unchanged data
# purely to re-trigger this workflow). No workflow_dispatch/API trigger is
# used, deliberately — that would need the site's GitHub token to gain an
# "Actions: read & write" permission it doesn't have today.
on:
  push:
    branches: [main]
    paths:
      - 'data/scenes.json'
      - 'data/cast.json'

permissions:
  contents: write

concurrency:
  group: generate-pdfs-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # A plain `apt-get install texlive ...` here used to take several
    # minutes on every single run (no package caching, full TeX Live
    # download+install from scratch each time) — the dominant cost in this
    # job and the main reason the frontend's completion poll
    # (MANUS_PDF_POLL_TIMEOUT_MS in js/manus.js) could time out before the
    # PDFs were actually done. Running the job inside a container image that
    # already has TeX Live baked in skips that install step entirely.
    # texlive/texlive:latest ships a full scheme (well beyond BasicTeX's
    # default), so every package scripts/generate-pdfs.js's .tex output
    # needs (babel-danish, geometry, amsmath/amssymb, graphicx, fancyhdr) is
    # already present.
    container:
      image: texlive/texlive:latest
    steps:
      # texlive/texlive doesn't ship git, which both actions/checkout (with
      # fetch-depth: 0, below) and the commit step at the end of this job
      # need — install it explicitly, before checkout runs. This is a small,
      # fast package, unlike the old full-TeX-Live apt-get this container
      # switch replaces.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node scripts/generate-pdfs.js

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Regenerate manuscript PDFs via generate-pdfs.js"
          # This job runs much longer than embed-scenes.yml's (LaTeX install +
          # compile), so by the time it's ready to push, that faster workflow
          # may have already pushed its own commit from the same trigger —
          # rebase onto whatever is current on main before pushing to avoid a
          # rejected non-fast-forward push.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
