name: Generate manuscript PDFs

# Fires on the exact same push trigger as embed-scenes.yml (any push
# touching data/scenes.json or data/cast.json) — both a plain Gem and a
# "Generér PDF'er" click on Main Manus View produce this push (see
# save_manus() in server/update-data.php, which stamps a second-granularity
# `generatedAt` timestamp onto both files on every save, guaranteeing a
# fresh, non-empty commit even when "Generér PDF'er" re-saves
# otherwise-unchanged data purely to re-trigger this workflow — `version`
# alone, at day granularity, wasn't enough: every same-day resave after the
# first produced a byte-identical PUT and a genuinely empty commit that
# GitHub's path filter silently ignored, caught live 2026-08-21).
#
# The job itself only actually runs for a "Generér PDF'er" click, though
# (2026-08-22) — a bare Gem shouldn't force every coordinator to wait
# through a ~2.5 min CI regen just to save a draft edit. manusRegeneratePdfs()
# (js/manus.js) sends regeneratePdfs:true, which save_manus() turns into a
# `[regen-pdfs]` marker in the commit message; the job-level `if:` below
# checks for exactly that marker and no-ops (shown as skipped, not run) for
# an ordinary Gem's commit. embed-scenes.yml is untouched by this and keeps
# firing on every save regardless, so scenes-data.js/CAST_DATA (what drives
# Vælg scener, Øveplan, etc.) stay live within ~1-2 min either way — only
# the compiled PDFs lag behind a bare Gem until "Generér PDF'er" is clicked.
#
# No workflow_dispatch/API trigger is used, deliberately — that would need
# the site's GitHub token to gain an "Actions: read & write" permission it
# doesn't have today.
on:
  push:
    branches: [main]
    paths:
      - 'data/scenes.json'
      - 'data/cast.json'

permissions:
  contents: write

concurrency:
  group: generate-pdfs-main
  cancel-in-progress: false

jobs:
  generate:
    if: contains(github.event.head_commit.message, '[regen-pdfs]')
    runs-on: ubuntu-latest
    # A plain `apt-get install texlive ...` here used to take several
    # minutes on every single run (no package caching, full TeX Live
    # download+install from scratch each time) — the dominant cost in this
    # job and the main reason the frontend's completion poll
    # (MANUS_PDF_POLL_TIMEOUT_MS in js/manus.js) could time out before the
    # PDFs were actually done. Running the job inside a container image that
    # already has TeX Live baked in skips that install step entirely.
    # `latest` (the full scheme, ~2.5 GB) worked but made "Initialize
    # containers" — pulling the image itself, since Actions runners share no
    # Docker layer cache between runs — the single biggest cost in the job
    # (~84s of a ~111s job, measured live 2026-08-21). Switched to
    # `latest-medium` (~898 MB, TeX Live's own docs call it "the sensible
    # landing spot when space is tight") since every package
    # scripts/generate-pdfs.js's .tex output needs (babel-danish, geometry,
    # amsmath/amssymb, graphicx, fancyhdr) is common enough to expect in
    # medium's "small + more packages and languages" scope — not yet
    # verified against a real Actions run; a missing package would fail
    # loudly and specifically at the pdflatex step (step 7) if this scheme
    # turns out too narrow, in which case fall back to `latest` or try
    # `latest-small` instead.
    container:
      image: texlive/texlive:latest-medium
    steps:
      # texlive/texlive doesn't ship git, which both actions/checkout (with
      # fetch-depth: 0, below) and the commit step at the end of this job
      # need — install it explicitly, before checkout runs. This is a small,
      # fast package, unlike the old full-TeX-Live apt-get this container
      # switch replaces.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node scripts/generate-pdfs.js

      - name: Commit generated PDFs
        run: |
          # Newer git refuses to operate on a repo it doesn't consider itself
          # the owner of ("fatal: detected dubious ownership in repository"),
          # which actions/checkout works around for its own clone — but this
          # step's git commands are a separate shell invocation and hit the
          # same check fresh against the checked-out files on the container's
          # mounted volume, whose UID doesn't necessarily match the
          # texlive/texlive image's default user (added once the container
          # switch above surfaced this: this step used to run directly on the
          # ubuntu-latest runner, where the mismatch never occurred).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Regenerate manuscript PDFs via generate-pdfs.js"
          # This job runs much longer than embed-scenes.yml's (LaTeX install +
          # compile), so by the time it's ready to push, that faster workflow
          # may have already pushed its own commit from the same trigger —
          # rebase onto whatever is current on main before pushing to avoid a
          # rejected non-fast-forward push.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
