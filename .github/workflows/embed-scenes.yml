name: Regenerate scenes-data.js

on:
  push:
    branches: [main]
    paths:
      - 'data/scenes.json'
      - 'data/cast.json'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/embed-scenes.js

      - name: Commit regenerated scenes-data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scenes-data.js
          git diff --staged --quiet || git commit -m "Regenerate scenes-data.js"
          git push
