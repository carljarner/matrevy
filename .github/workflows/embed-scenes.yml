name: Regenerate embedded data files

on:
  push:
    branches: [main]
    paths:
      - 'data/*.json'

permissions:
  contents: write

concurrency:
  group: embed-scenes-main
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/embed-scenes.js

      - name: Commit regenerated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # List every generated *-data.js output here (see scripts/embed-scenes.js's EMBEDS)
          git add js/scenes-data.js js/calendar-data.js js/archive-data.js js/posts-data.js js/bosses-data.js calendar.ics
          git diff --staged --quiet || git commit -m "Regenerate embedded data files"
          git push
